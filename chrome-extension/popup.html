<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT 对话目录</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #f8fafc;
      }

      .header {
        background: #10a37f; /* Updated color */
        color: white;
        padding: 20px;
        text-align: center;
      }

      .header h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }

      .content {
        padding: 20px;
      }

      .actions {
        margin-top: 20px;
      }

      .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        margin-bottom: 8px;
      }

      .btn-danger {
        background: #ef4444;
        color: white;
      }

      .btn-danger:hover {
        background: #dc2626;
      }

      .btn-primary {
        background: #10a37f;
        color: white;
      }

      .btn-primary:hover {
        background: #0f9671;
      }

      .btn-secondary {
        background: #f1f5f9;
        color: #1e293b;
      }

      .btn-secondary:hover {
        background: #e2e8f0;
      }

      .status-message {
        margin-top: 12px;
        font-size: 13px;
        color: #10a37f;
        text-align: center;
        display: none; /* Initially hidden */
      }

      .footer {
        padding: 16px 20px;
        text-align: center;
        font-size: 12px;
        color: #64748b;
        border-top: 1px solid #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>ChatGPT 对话目录</h1>
    </div>

    <div class="content">
      <p>管理你的会话历史，快速回顾、搜索和定位你的问题。</p>
      <div class="actions">
        <button class="btn btn-primary" id="user-guide-btn">使用说明</button>
        <button class="btn btn-secondary" id="feedback-btn">反馈建议</button>
        <button class="btn btn-danger" id="clear-cache-btn">
          清除本地缓存
        </button>
        <p id="status-message" class="status-message">
          缓存已清除！请刷新页面。
        </p>
      </div>
    </div>

    <div class="footer">
      <p>版本 1.1.0</p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
